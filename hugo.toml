baseURL = 'https://blog.manuq.ar'
theme = 'manuq'
defaultContentLanguage = 'es'

[languages]
  [languages.es]
    title = "el blog de manuq"
    locale = 'es-AR'
    label = 'Español'
  [languages.en]
    title = "manuq's blog"
    locale = 'en-US'
    label = 'English'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup.goldmark.renderer]
  # Sólo para poner un <a href="mailto:">
  # Buscar alternativa.
  unsafe= true
